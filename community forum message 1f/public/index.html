<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Entry Screen -->
  <div id="entry-screen" class="entry-screen">
    <div class="entry-card">
      <div class="entry-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="url(#g1)"/>
          <path d="M14 28C14 24.6863 16.6863 22 20 22H28C31.3137 22 34 24.6863 34 28V34H14V28Z" fill="white" fill-opacity="0.9"/>
          <circle cx="20" cy="20" r="3" fill="white" fill-opacity="0.9"/>
          <circle cx="28" cy="20" r="3" fill="white" fill-opacity="0.9"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="48" y2="48">
              <stop stop-color="#667eea"/>
              <stop offset="1" stop-color="#764ba2"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="entry-title">Social Hub</h1>
      <p class="entry-subtitle">Chat in real-time or share posts with everyone</p>
      <div class="entry-form">
        <div class="input-group">
          <input type="text" id="room-input" class="input" placeholder="Enter your name to get started..." maxlength="30" autofocus />
          <button id="join-btn" class="btn btn-primary">Get Started</button>
        </div>
      </div>
      <div class="popular-rooms">
        <span class="popular-label">Jump in:</span>
        <div class="popular-tags" id="popular-tags"></div>
      </div>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="app-screen" class="app-screen hidden">

    <!-- Tab Navigation -->
    <nav class="tab-bar">
      <div class="tab-bar-inner">
        <button id="tab-chat" class="tab-btn active" data-tab="chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Chat
        </button>
        <button id="tab-feed" class="tab-btn" data-tab="feed">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Feed
        </button>
        <div class="tab-spacer"></div>
        <button id="leave-btn" class="btn btn-ghost tab-leave-btn" title="Leave">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Leave
        </button>
      </div>
    </nav>

    <!-- Disconnect Banner -->
    <div id="disconnect-banner" class="disconnect-banner hidden">
      <span>Connection lost. Reconnecting...</span>
      <div class="spinner"></div>
    </div>

    <!-- ===== CHAT VIEW ===== -->
    <div id="chat-view" class="tab-content active">
      <!-- Sidebar Overlay (mobile) -->
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="10" fill="url(#g2)"/>
            <path d="M14 28C14 24.6863 16.6863 22 20 22H28C31.3137 22 34 24.6863 34 28V34H14V28Z" fill="white" fill-opacity="0.9"/>
            <circle cx="20" cy="20" r="3" fill="white" fill-opacity="0.9"/>
            <circle cx="28" cy="20" r="3" fill="white" fill-opacity="0.9"/>
            <defs>
              <linearGradient id="g2" x1="0" y1="0" x2="48" y2="48">
                <stop stop-color="#667eea"/>
                <stop offset="1" stop-color="#764ba2"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="sidebar-title">Rooms</span>
        </div>

        <div class="room-list" id="room-list">
          <!-- Dynamically populated -->
        </div>

        <div class="sidebar-footer">
          <div class="create-room-form">
            <input type="text" id="create-room-input" class="input input-sm" placeholder="Create room..." maxlength="30" />
            <button id="create-room-btn" class="btn btn-sm btn-primary" title="Create Room">+</button>
          </div>
        </div>
      </aside>

      <!-- Chat Main -->
      <main class="chat-main">
        <!-- Chat Header -->
        <header class="chat-header">
          <button id="sidebar-toggle" class="btn btn-ghost sidebar-toggle" title="Toggle Room List">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="chat-header-info">
            <h2 id="current-room-name" class="current-room">#general</h2>
            <span id="room-user-count" class="room-user-count">0 users</span>
          </div>
          <button id="leave-room-btn" class="btn btn-ghost leave-room-btn" title="Leave Room">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Leave
          </button>
        </header>

        <!-- Messages Area -->
        <div class="messages-area" id="messages-area">
          <div class="messages-container" id="messages-container">
            <!-- Messages appear here -->
          </div>
        </div>

        <!-- Message Input -->
        <footer class="chat-footer">
          <div class="message-input-wrapper">
            <input
              type="text"
              id="message-input"
              class="input message-input"
              placeholder="Type a message..."
              maxlength="1000"
            />
            <button id="send-btn" class="btn btn-send" disabled title="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </footer>
      </main>
    </div>

    <!-- ===== FEED VIEW ===== -->
    <div id="feed-view" class="tab-content">
      <div class="feed-layout">
        <!-- Create Post -->
        <div class="create-post-card">
          <div class="create-post-header">
            <div id="feed-user-avatar" class="post-avatar" style="background: #667eea">Y</div>
            <span class="create-post-label">Create a Post</span>
          </div>
          <textarea
            id="post-text-input"
            class="input post-text-input"
            placeholder="What's on your mind?"
            maxlength="2000"
            rows="3"
          ></textarea>
          <div class="post-input-actions">
            <div class="post-media-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); flex-shrink: 0;">
                <rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
              </svg>
              <input
                type="text"
                id="post-media-input"
                class="input input-sm post-media-input"
                placeholder="Image or video URL (optional)"
                maxlength="500"
              />
            </div>
            <button id="post-submit-btn" class="btn btn-primary btn-sm" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              Post
            </button>
          </div>
        </div>

        <!-- Feed Posts -->
        <div class="feed-list" id="feed-list">
          <!-- Posts appear here -->
        </div>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
