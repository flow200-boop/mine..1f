<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Hub</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Animated background blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <!-- Main App Screen -->
  <div id="app-screen" class="app-screen">

    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="top-nav-inner">
        <div class="nav-brand">
          <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="url(#navGrad)"/>
            <path d="M14 28C14 24.6863 16.6863 22 20 22H28C31.3137 22 34 24.6863 34 28V34H14V28Z" fill="white" fill-opacity="0.9"/>
            <circle cx="20" cy="19" r="3" fill="white" fill-opacity="0.9"/>
            <circle cx="28" cy="19" r="3" fill="white" fill-opacity="0.9"/>
            <defs>
              <linearGradient id="navGrad" x1="0" y1="0" x2="48" y2="48">
                <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="nav-title">Social Hub</span>
        </div>

        <div class="nav-tabs">
          <button id="tab-chat" class="nav-tab active" data-tab="chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            Messages
          </button>
          <button id="tab-feed" class="nav-tab" data-tab="feed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Feed
          </button>
        </div>

        <div class="nav-user" id="nav-user">
          <div id="nav-user-avatar" class="user-avatar-sm" style="background: #8b5cf6">U</div>
          <span id="nav-user-name" class="nav-username">User_abcd</span>
        </div>
      </div>
    </nav>

    <!-- Disconnect Banner -->
    <div id="disconnect-banner" class="disconnect-banner hidden">
      <div class="spinner"></div>
      <span>Connection lost. Reconnecting...</span>
    </div>

    <!-- ===== MESSAGES VIEW ===== -->
    <div id="chat-view" class="tab-content active">
      <!-- Overlay for mobile sidebar -->
      <div id="users-overlay" class="users-overlay"></div>

      <!-- Users Sidebar -->
      <aside id="users-sidebar" class="users-sidebar">
        <div class="users-sidebar-header">
          <div class="users-sidebar-title-row">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Online</span>
            <span id="online-count" class="online-count">0</span>
          </div>
          <button id="users-toggle" class="btn-icon users-toggle" title="Toggle users list">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>

        <div id="users-list" class="users-list">
          <!-- Dynamically populated -->
        </div>
      </aside>

      <!-- DM Main Area -->
      <main class="dm-main">
        <div id="dm-welcome" class="dm-welcome">
          <div class="dm-welcome-icon">
            <svg width="64" height="64" viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" rx="12" fill="url(#dmGrad)"/>
              <path d="M14 26C14 22.6863 16.6863 20 20 20H28C31.3137 20 34 22.6863 34 26V34H14V26Z" fill="white" fill-opacity="0.9"/>
              <circle cx="18" cy="18" r="2.5" fill="white" fill-opacity="0.9"/>
              <circle cx="30" cy="18" r="2.5" fill="white" fill-opacity="0.9"/>
              <path d="M16 14C16 12.8954 16.8954 12 18 12H30C31.1046 12 32 12.8954 32 14" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
              <defs>
                <linearGradient id="dmGrad" x1="0" y1="0" x2="48" y2="48">
                  <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2 class="dm-welcome-title">Your Messages</h2>
          <p class="dm-welcome-text">Select a user from the sidebar to start chatting</p>
        </div>

        <div id="dm-conversation" class="dm-conversation hidden">
          <!-- DM Header -->
          <header class="dm-header">
            <button id="users-toggle-mobile" class="btn-icon users-toggle" title="Show users">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <div class="dm-header-info">
              <div id="dm-target-avatar" class="user-avatar-sm" style="background: #4ECDC4">U</div>
              <div class="dm-header-text">
                <h2 id="dm-target-name" class="dm-target-name">User_abcd</h2>
                <span id="dm-target-status" class="dm-target-status">Online</span>
              </div>
            </div>
          </header>

          <!-- Messages Area -->
          <div class="dm-messages-area" id="dm-messages-area">
            <div class="dm-messages-container" id="dm-messages-container">
              <!-- Messages appear here -->
            </div>
          </div>

          <!-- Message Input -->
          <footer class="dm-footer">
            <div class="dm-input-wrapper">
              <input
                type="text"
                id="dm-input"
                class="dm-input"
                placeholder="Type a message..."
                maxlength="1000"
              />
              <button id="dm-send-btn" class="btn-send-dm" disabled title="Send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </footer>
        </div>
      </main>
    </div>

    <!-- ===== FEED VIEW ===== -->
    <div id="feed-view" class="tab-content">
      <div class="feed-layout">
        <!-- Create Post -->
        <div class="glass-card create-post-card">
          <div class="create-post-header">
            <div id="feed-user-avatar" class="user-avatar-sm" style="background: #8b5cf6">U</div>
            <span class="create-post-label">Share something...</span>
          </div>
          <textarea
            id="post-text-input"
            class="glass-input post-text-input"
            placeholder="What's on your mind?"
            maxlength="2000"
            rows="3"
          ></textarea>
          <div class="post-input-actions">
            <div class="post-media-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); flex-shrink: 0;">
                <rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
              </svg>
              <input
                type="text"
                id="post-media-input"
                class="glass-input input-sm post-media-input"
                placeholder="Image or video URL (optional)"
                maxlength="500"
              />
            </div>
            <button id="post-submit-btn" class="btn-glass btn-glass-primary btn-glass-sm" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              Post
            </button>
          </div>
        </div>

        <!-- Feed Posts -->
        <div class="feed-list" id="feed-list">
          <!-- Posts appear here -->
        </div>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
